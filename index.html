<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred again.. — Tour Poster</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="poster">
    <!-- Hero Crowd Section -->
    <div class="crowd">
      <div class="crowd-content">
        <h1>FRED AGAIN..</h1>
        <p>PLACES WE'VE NEVER BEEN TOUR</p>
      </div>
    </div>

    <!-- Stage & Interactive Controller -->
    <section class="stage">
      <div class="deck">
        <!-- 2 Spinning Circles -->
        <div class="jog left"></div>
        <div class="jog right"></div>

        <!-- 6 Pads with Different Accent Colors -->
        <div class="pads">
          <label class="pad" style="--light-color: #ff5a1f;">
            <input type="checkbox" />
            <span class="date">12 Mar</span>
            <span class="city">London</span>
            <span class="voice">Alexandra Palace</span>
          </label>

          <label class="pad" style="--light-color: #00f0ff;">
            <input type="checkbox" />
            <span class="date">15 Mar</span>
            <span class="city">Berlin</span>
            <span class="voice">Velodrom</span>
          </label>

          <label class="pad" style="--light-color: #ff007f;">
            <input type="checkbox" />
            <span class="date">19 Mar</span>
            <span class="city">Paris</span>
            <span class="voice">Zénith</span>
          </label>

          <label class="pad" style="--light-color: #ffe600;">
            <input type="checkbox" />
            <span class="date">24 Mar</span>
            <span class="city">Amsterdam</span>
            <span class="voice">Ziggo Dome</span>
          </label>

          <label class="pad" style="--light-color: #00ff66;">
            <input type="checkbox" />
            <span class="date">28 Mar</span>
            <span class="city">New York</span>
            <span class="voice">Forest Hills Stadium</span>
          </label>

          <label class="pad" style="--light-color: #b000ff;">
            <input type="checkbox" />
            <span class="date">02 Apr</span>
            <span class="city">Los Angeles</span>
            <span class="voice">LA Coliseum</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Separate Tickets Button on the Bottom-Right -->
    <a href="https://www.fredagain.com" target="_blank" rel="noopener noreferrer" class="fixed-tickets">Get Tickets</a>
  </main>

</body>
</html>
